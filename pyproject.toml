[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "EBP-sweep"
dynamic = ["version"]
description = "Eclipse timing variations and apsidal precession of eclipsing binaries from TESS photometry."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Babatunde Akinsanmi", email = "t.akinsanmi@unsw.edu.au" },
    { name = "Margo Thornton", email = "m.thornton@unsw.edu.au" }
]
keywords = [
    "astronomy",
    "eclipsing binaries",
    "TESS",
    "apsidal precession",
    "eclipse timing variations",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    # batman-package's compiled extensions (as of 2.5.3) were built against
    # the NumPy 1.x C-API and crash under NumPy 2.x at import time
    # (AttributeError: _ARRAY_API not found); capped until upstream ships a
    # NumPy-2.0-ABI build.
    "numpy>=1.26,<2",
    "scipy>=1.15",
    "pandas>=2.3",
    "matplotlib>=3.10",
    "astropy>=6.1",
    "lightkurve>=2.6",
    "astroquery>=0.4.11",
    # PyPI's transitleastsquares is stuck at 1.32; the 1.33 release
    # is only available from GitHub.
    "transitleastsquares @ git+https://github.com/hippke/tls.git",
    "batman-package>=2.5.2",
    "lmfit>=1.3.4",
    "uncertainties>=3.2.3",
    "fpdf2>=2.7",
    "Pillow>=12.0",
    "tqdm>=4.67",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/tundeakins/EBP_sweep"

[project.scripts]
ebp-sweep = "EBP_sweep.cli:main"

[tool.hatch.metadata]
# Required for the transitleastsquares dependency above, which is pinned to a
# git URL rather than a PyPI version (see the comment on that line). This
# also means EBP-sweep itself cannot be published to PyPI as-is — PyPI
# rejects packages with direct-reference (URL) dependencies.
allow-direct-references = true

[tool.hatch.version]
path = "src/EBP_sweep/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/EBP_sweep"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
