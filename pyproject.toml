[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "EBP-sweep"
dynamic = ["version"]
description = "Eclipse timing variations and apsidal precession of eclipsing binaries from TESS (and ground-based follow-up) photometry."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Babatunde Akinsanmi", email = "babatundeakinsanmi@gmail.com" },
]
keywords = [
    "astronomy",
    "eclipsing binaries",
    "TESS",
    "apsidal precession",
    "eclipse timing variations",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.15",
    "pandas>=2.3",
    "matplotlib>=3.10",
    "astropy>=6.1",
    "lightkurve>=2.5",
    "astroquery>=0.4.11",
    "transitleastsquares>=1.33",
    "batman-package>=2.5.2",
    "lmfit>=1.3.4",
    "uncertainties>=3.2.3",
    "fpdf2>=2.7",
    "Pillow>=12.0",
    "tqdm>=4.67",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/<your-github-username>/EBP_sweep"

[project.scripts]
ebp-sweep = "EBP_sweep.cli:main"

[tool.hatch.version]
path = "src/EBP_sweep/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/EBP_sweep"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
